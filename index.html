
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIFAPorVIBRA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0 0 10px;
  font-size: 36px;
}

header p {
  margin: 0;
  font-size: 17px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.info {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
  text-align: center;
  box-shadow: 0 2px 10px #ccc;
}

.price {
  font-size: 24px;
  font-weight: bold;
  margin: 10px;
}

input {
  width: 100%;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 18px;
  margin: 10px 0;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 16px;
  cursor: pointer;
}

.search-btn {
  background: #111;
  color: white;
  width: 100%;
}

#numeros {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-top: 20px;
}

.numero {
  background: white;
  border: 2px solid #ddd;
  padding: 12px 4px;
  font-weight: bold;
}

.numero:hover {
  background: #eee;
}

.numero.seleccionado {
  background: #111;
  color: white;
  border-color: #111;
}

.resumen {
  position: sticky;
  bottom: 10px;
  background: white;
  padding: 18px;
  margin-top: 25px;
  border-radius: 15px;
  box-shadow: 0 2px 15px #aaa;
  text-align: center;
}

.comprar {
  background: #198754;
  color: white;
  width: 100%;
  margin-top: 12px;
  font-size: 18px;
  font-weight: bold;
}

@media (max-width: 500px) {
  header h1 {
    font-size: 30px;
  }

  #numeros {
    grid-template-columns: repeat(4, 1fr);
  }

  .numero {
    font-size: 14px;
    padding: 10px 2px;
  }
}
</style>
</head>

<body>

<header>
  <h1>RIFAPorVIBRA</h1>
  <p>Plataforma digital para comprar y consultar boletos</p>
</header>

<div class="container">

  <div class="info">
    <h2>🎟️ Selecciona tus números</h2>

    <div class="price">
      $50 pesos por boleto
    </div>

    <p>
      Elige uno o varios números del 00001 al 10000.
    </p>

    <input
      type="number"
      id="buscar"
      min="1"
      max="10000"
      placeholder="Buscar número..."
    >

    <button class="search-btn" onclick="buscarNumero()">
      🔎 Buscar número
    </button>
  </div>

  <div id="numeros"></div>

  <div class="resumen">
    <strong>Números seleccionados:</strong>
    <div id="seleccionados">Ninguno</div>

    <p>
      Total: <strong>$<span id="total">0</span> pesos</strong>
    </p>

    <button class="comprar" onclick="comprar()">
      🛒 Continuar con la compra
    </button>
  </div>

</div>

<script>

const precio = 50;
let seleccionados = [];

const contenedor = document.getElementById("numeros");

function mostrarNumeros(inicio = 1, cantidad = 100) {

  contenedor.innerHTML = "";

  const fin = Math.min(inicio + cantidad - 1, 10000);

  for (let i = inicio; i <= fin; i++) {

    const numero = String(i).padStart(5, "0");

    const boton = document.createElement("button");

    boton.className = "numero";
    boton.textContent = numero;

    if (seleccionados.includes(i)) {
      boton.classList.add("seleccionado");
    }

    boton.onclick = function() {
      seleccionar(i);
    };

    contenedor.appendChild(boton);
  }
}

function seleccionar(numero) {

  if (seleccionados.includes(numero)) {

    seleccionados = seleccionados.filter(n => n !== numero);

  } else {

    seleccionados.push(numero);

  }

  actualizar();
  mostrarNumeros(Math.max(1, Math.floor((numero - 1) / 100) * 100 + 1), 100);
}

function actualizar() {

  const lista = document.getElementById("seleccionados");

  if (seleccionados.length === 0) {

    lista.textContent = "Ninguno";

  } else {

    lista.textContent = seleccionados
      .sort((a,b) => a-b)
      .map(n => String(n).padStart(5,"0"))
      .join(", ");

  }

  document.getElementById("total").textContent =
    seleccionados.length * precio;
}

function buscarNumero() {

  const numero = parseInt(
    document.getElementById("buscar").value
  );

  if (!numero || numero < 1 || numero > 10000) {

    alert("Escribe un número entre 1 y 10000.");

    return;
  }

  const pagina =
    Math.floor((numero - 1) / 100) * 100 + 1;

  mostrarNumeros(pagina, 100);

  setTimeout(() => {

    const botones = document.querySelectorAll(".numero");

    botones.forEach(boton => {

      if (boton.textContent === String(numero).padStart(5,"0")) {

        boton.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }

    });

  }, 100);
}

function comprar() {

  if (seleccionados.length === 0) {

    alert("Primero selecciona al menos un número.");

    return;
  }

  alert(
    "Has seleccionado " +
    seleccionados.length +
    " boleto(s).\n\nTotal: $" +
    (seleccionados.length * precio) +
    " pesos."
  );
}

mostrarNumeros(1, 100);

</script>

</body>
</html>
